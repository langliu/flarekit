packages:
  - apps/*
  - packages/*
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
  lefthook: true
minimumReleaseAgeExclude:
  - '@cloudflare/workers-types@5.20260917.1'
  - 'typescript@7.0.2'
catalog:
  dotenv: ^17.4.2
  zod: ^4.6.5
  typescript: ^7.0.2
  '@types/node': ^22.20.3
  '@cloudflare/workers-types': ^5.20260917.1
  hono: ^4.13.8
  '@orpc/server': ^1.15.1
  '@orpc/openapi': ^1.15.1
  '@orpc/zod': ^1.15.1
  better-auth: 1.6.23
  alchemy: ^0.93.12
  wrangler: ^4.132.0
  lucide-react: ^1.46.0
  next-themes: ^0.4.6
  react: ^19.3.0
  react-dom: ^19.3.0
  sonner: ^2.0.8
  tailwindcss: ^4.3.3
  '@orpc/client': ^1.15.1
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  drizzle-orm: ^0.45.2
  vite: npm:@voidzero-dev/vite-plus-core@0.3.2
  vite-plus: 0.3.2
overrides:
  vite@*: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
